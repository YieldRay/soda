name: Publishing on NPM

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - package.json

permissions:
    contents: read
    id-token: write

jobs:
    publish-npm:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Build package
              run: |
                  pnpm install
                  pnpm run build

            - name: Publishing on NPM
              uses: JS-DevTools/npm-publish@v4
              with:
                  access: public
                  provenance: true
